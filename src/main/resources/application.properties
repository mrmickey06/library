spring.application.name=library

# Server port (Render provides PORT env variable)
server.port=${PORT:8080}

# Database Connection Details (use environment variables for production)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/success_point_library?sslMode=VERIFY_IDENTITY&useUnicode=true&characterEncoding=utf-8&useServerPrepStmts=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&rewriteBatchedStatements=true&elideSetAutoCommits=true&maintainTimeStats=false&connectTimeout=5000&socketTimeout=30000}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Java Mail Sender Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:mrajput2106@gmail.com}
spring.mail.password=${MAIL_PASSWORD:pstvszuxfgzyzupw}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Fix for proxy/ngrok header issues
server.forward-headers-strategy=framework
# --- Hikari Connection Pool Settings ---
# TiDB usually has an idle timeout of 5-10 minutes. 
# We set max-lifetime to 4 minutes (240000ms) to be safe.
spring.datasource.hikari.max-lifetime=240000

# Keep the connection alive by sending a tiny "ping" every 30 seconds
spring.datasource.hikari.keepalive-time=30000

# How long to wait for a connection before failing (30 seconds)
spring.datasource.hikari.connection-timeout=30000

# Minimum number of idle connections in the pool
# spring.datasource.hikari.minimum-idle=5

# # Maximum number of connections in the pool
# spring.datasource.hikari.maximum-pool-size=10

# --- Clean up the JPA warning from your logs ---
spring.jpa.open-in-view=false
# Pre-initialize the pool so connections are "warm" and ready
spring.datasource.hikari.initialization-fail-timeout=0
# Matches min and max so the pool never shrinks
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=10
