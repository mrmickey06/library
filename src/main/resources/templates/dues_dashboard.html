<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pending Dues | Success Point</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        :root {
            --brand-dark: #0f172a;
            --brand-red: #e11d48;
            --sidebar-width: 280px;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc;
            color: #1e293b;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* --- SIDEBAR (Same as Dashboard) --- */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--brand-dark);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 1000;
            transition: var(--transition-smooth);
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-header {
            padding: 2rem 1.5rem;
            color: white;
            font-weight: 800;
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: -1px;
        }

        .nav-link {
            color: #94a3b8;
            padding: 12px 20px;
            margin: 4px 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            font-weight: 500;
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        .nav-link i { font-size: 1.25rem; margin-right: 12px; }

        .nav-link:hover, .nav-link.active {
            background: rgba(225, 29, 72, 0.1);
            color: var(--brand-red);
        }

        .nav-link.active {
            background: var(--brand-red);
            color: white !important;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 2rem;
            transition: var(--transition-smooth);
        }

        .dues-card {
            background: white;
            border-radius: 20px;
            border: 1px solid #fee2e2;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .table thead th {
            background: #fff1f2;
            color: #991b1b;
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 1rem 1.5rem;
            border: none;
        }

        .expired-badge {
            background: #fef2f2;
            color: #e11d48;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .btn-renew {
            background: #10b981;
            color: white;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 6px 16px;
            text-decoration: none;
            transition: 0.2s;
        }

        .btn-renew:hover { background: #059669; transform: translateY(-1px); }

        /* --- MOBILE NAVIGATION --- */
        .mobile-header {
            display: none;
            background: var(--brand-dark);
            color: white;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 1100;
            justify-content: space-between;
            align-items: center;
        }

        @media (max-width: 992px) {
            .sidebar { left: -100%; }
            .sidebar.active { left: 0; width: 100%; }
            .main-content { margin-left: 0; padding: 1rem; }
            .mobile-header { display: flex; }
        }
    </style>
</head>
<body>

    <div class="mobile-header">
        <span class="fw-bold fs-5">Success Point</span>
        <button class="btn btn-dark" onclick="toggleSidebar()">
            <i class="bi bi-list fs-3"></i>
        </button>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">SUCCESS POINT</div>
        
        <nav class="mt-3">
            <a href="/admin/dashboard" class="nav-link">
                <i class="bi bi-grid-1x2-fill"></i> All Students
            </a>
            <a href="/admin/add-student" class="nav-link">
                <i class="bi bi-person-plus-fill"></i> Add Student
            </a>
            <a href="/admin/dues" class="nav-link active">
                <i class="bi bi-clock-history"></i> Pending Dues
            </a>
            <a href="#" class="nav-link" data-bs-toggle="modal" data-bs-target="#downloadModal">
                <i class="bi bi-cloud-arrow-down-fill"></i> Export Data
            </a>
            
            <div style="margin-top: auto; padding-top: 100px;">
                <a href="/admin-logout" class="nav-link text-danger">
                    <i class="bi bi-box-arrow-left"></i> Logout
                </a>
            </div>
        </nav>
    </div>

    <div class="main-content">
        <div class="mb-4">
            <h2 class="fw-800 text-danger mb-1">Overdue Accounts</h2>
            <p class="text-muted small">Immediate action required for expired memberships</p>
        </div>

        <div class="dues-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Contact</th>
                            <th>Expired On</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="student : ${students}">
                            <td><div class="fw-bold" th:text="${student.name}"></div></td>
                            <td><a th:href="'tel:' + ${student.mobileNumber}" class="text-decoration-none fw-600" th:text="${student.mobileNumber}"></a></td>
                            <td><span class="expired-badge" th:text="${student.dueDate}"></span></td>
                            <td class="text-center">
                                <a th:href="@{/admin/renew-student/{id}(id=${student.id})}" class="btn-renew shadow-sm">RENEW</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
                
                <div th:if="${#lists.isEmpty(students)}" class="p-5 text-center text-muted">
                    <i class="bi bi-check-circle-fill text-success fs-1"></i>
                    <p class="mt-2 fw-bold">All memberships are currently active!</p>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="downloadModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 shadow-lg">
                <div class="modal-header bg-dark text-white border-0">
                    <h5 class="modal-title fw-bold">Export Student Data</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form action="/admin/download-excel" method="GET">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">FROM DATE</label>
                            <input type="date" class="form-control" name="startDate" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">TO DATE</label>
                            <input type="date" class="form-control" name="endDate" required>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="submit" class="btn btn-danger w-100 fw-bold">DOWNLOAD EXCEL</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }
    </script>
</body>
</html>
