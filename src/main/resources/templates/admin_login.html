<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Login | Success Point</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
        .login-card { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .icon-box { width: 70px; height: 70px; background: #6366f1; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 2rem; box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }
        .form-control { background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 12px; padding: 12px 15px; font-weight: 500; }
        .form-control:focus { background: #0f172a; border-color: #6366f1; color: #fff; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2); }
        .btn-login { background: #6366f1; border: none; border-radius: 12px; padding: 14px; font-weight: 800; width: 100%; transition: 0.3s; margin-top: 10px; }
        .btn-login:hover { background: #4f46e5; transform: translateY(-2px); }
        .back-link { color: #94a3b8; text-decoration: none; display: block; text-align: center; margin-top: 20px; font-weight: 600; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="icon-box"><i class="bi bi-shield-lock-fill"></i></div>
        <h2 class="text-center fw-800 mb-1">Admin Portal</h2>
        <p class="text-center text-secondary small mb-4">Success Point Library Management</p>
        
        <div th:if="${error}" class="alert alert-danger border-0 small text-center" th:text="${error}"></div>
        
        <form action="/admin-login" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary text-uppercase">Mobile Number</label>
                <input type="text" class="form-control" name="mobileNumber" required placeholder="Registered ID">
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold text-secondary text-uppercase">Password</label>
                <input type="password" class="form-control" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-login">ACCESS DASHBOARD</button>
        </form>
        <a href="/" class="back-link"><i class="bi bi-arrow-left me-1"></i> Return to Home</a>
    </div>
</body>
</html>
