<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Applications | Success Point</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        :root {
            --brand-dark: #0f172a;
            --brand-primary: #4f46e5;
            --sidebar-width: 280px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc;
            color: #1e293b;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--brand-dark);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 1000;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.25s ease;
        }

        .sidebar-header {
            padding: 2rem 1.5rem;
            color: white;
            font-weight: 800;
            font-size: 1.35rem;
            text-align: center;
        }

        .nav-link {
            color: #94a3b8;
            padding: 12px 20px;
            margin: 4px 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            text-decoration: none;
        }

        .nav-link:hover,
        .nav-link.active {
            background: var(--brand-primary);
            color: white;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            padding: 2rem;
        }

        .mobile-header {
            display: none;
            background: var(--brand-dark);
            color: white;
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 1100;
            justify-content: space-between;
            align-items: center;
        }

        .applications-card {
            background: white;
            border-radius: 18px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.06);
            overflow: hidden;
        }

        .table thead th {
            background: #eef2ff;
            color: #3730a3;
            border: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            font-weight: 700;
            padding: 1rem 1.2rem;
        }

        .btn-review {
            background: #4f46e5;
            color: white;
            border-radius: 10px;
            padding: 7px 14px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .btn-review:hover {
            background: #4338ca;
            color: white;
        }

        @media (max-width: 992px) {
            .mobile-header {
                display: flex;
            }

            .sidebar {
                left: -100%;
            }

            .sidebar.active {
                left: 0;
                width: 100%;
            }

            .main-content {
                margin-left: 0;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="mobile-header">
        <span class="fw-bold">Success Point</span>
        <button class="btn btn-dark" onclick="toggleSidebar()">
            <i class="bi bi-list fs-4"></i>
        </button>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">SUCCESS POINT</div>
        <nav class="mt-2">
            <a href="/admin/dashboard" class="nav-link"><span><i class="bi bi-grid-1x2-fill me-2"></i> Dashboard</span></a>
            <a href="/admin/add-student" class="nav-link"><span><i class="bi bi-person-plus-fill me-2"></i> Add Student</span></a>
            <a href="/admin/dues" class="nav-link"><span><i class="bi bi-clock-history me-2"></i> Pending Dues</span></a>
            <a href="/admin/applications" class="nav-link active">
                <span><i class="bi bi-file-earmark-text me-2"></i> Applications</span>
                <span class="badge bg-warning text-dark" th:text="${applicationsCount}"></span>
            </a>
            <a href="/admin/pending-fees" class="nav-link">
                <span><i class="bi bi-wallet2 me-2"></i> Pending Fees</span>
                <span class="badge bg-danger" th:text="${pendingFeesCount}"></span>
            </a>
            <a href="/admin/total-amount" class="nav-link"><span><i class="bi bi-cash-stack me-2"></i> Total Amount</span></a>
            <a href="/admin-logout" class="nav-link text-danger mt-4"><span><i class="bi bi-box-arrow-left me-2"></i> Logout</span></a>
        </nav>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-800 mb-1">New Student Applications</h2>
                <p class="text-muted mb-0">Review requests, edit details, and approve or reject.</p>
            </div>
            <span class="badge bg-primary fs-6" th:text="${applicationsCount} + ' pending'"></span>
        </div>

        <div class="applications-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Mobile</th>
                            <th>Email</th>
                            <th>Plan</th>
                            <th>Fees</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="student : ${students}">
                            <td class="fw-bold" th:text="${student.name}"></td>
                            <td th:text="${student.mobileNumber}"></td>
                            <td th:text="${student.email}"></td>
                            <td th:text="${student.feesPeriodMonths} + ' Month(s)'"></td>
                            <td th:text="'Rs ' + ${student.feesPaid}"></td>
                            <td class="text-center">
                                <a class="btn-review" th:href="@{/admin/applications/{id}(id=${student.id})}">
                                    <i class="bi bi-eye-fill me-1"></i> Review
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div th:if="${#lists.isEmpty(students)}" class="p-5 text-center text-muted">
                    <i class="bi bi-check-circle-fill text-success fs-1"></i>
                    <p class="fw-bold mt-2 mb-0">No pending applications right now.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }
    </script>
</body>
</html>
