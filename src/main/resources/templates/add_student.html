<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registration | Success Point</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        :root {
            --brand-primary: #4f46e5;
            --brand-dark: #0f172a;
            --bg-light: #f8fafc;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-light);
            color: var(--brand-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            touch-action: manipulation;
        }

        /* --- Compact Navbar --- */
        .navbar {
            background: var(--brand-dark) !important;
            padding: 0.5rem 0;
            border-bottom: 2px solid var(--brand-primary);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.1rem !important;
            color: white !important;
        }

        .btn-back {
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s;
        }

        .btn-back:hover { color: white; }

        /* --- Slim Form Card --- */
        .form-container {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 20px 0;
        }

        .form-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 30px;
            width: 100%;
            max-width: 450px; /* Forces a professional slim width */
            margin: auto;
        }

        .form-header {
            margin-bottom: 25px;
        }

        .form-title {
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.5px;
            color: var(--brand-dark);
            margin-bottom: 4px;
        }

        .form-subtitle { font-size: 0.85rem; color: #64748b; }

        /* --- Tight Input Styling --- */
        .form-label {
            font-weight: 600;
            font-size: 0.75rem;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.9rem;
            font-weight: 500;
            background-color: #ffffff;
            transition: 0.2s;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            outline: none;
        }

        /* --- Compact Info Alert --- */
        .alert-info-custom {
            background: #f0f4ff;
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            border: 1px solid #dbeafe;
        }

        .alert-info-custom i { color: var(--brand-primary); font-size: 1rem; }
        .alert-info-custom p { margin: 0; color: #1e1b4b; font-size: 0.75rem; font-weight: 500; }

        /* --- Professional Submit Button --- */
        .btn-submit {
            background: var(--brand-primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            width: 100%;
            transition: 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
        }

        .btn-submit:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }

        @media (max-width: 576px) {
            .form-card { padding: 20px; border-radius: 0; border: none; max-width: 100%; height: 100%; }
            .form-container { padding: 0; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container d-flex justify-content-between">
            <span class="navbar-brand">
                <i class="bi bi-shield-check me-2 text-primary"></i>SUCCESS POINT
            </span>
            <a href="/admin/dashboard" class="btn-back">
                <i class="bi bi-x-lg me-1"></i> CLOSE
            </a>
        </div>
    </nav>

    <div class="form-container">
        <div class="form-card shadow-sm">
            
            <div class="form-header text-center">
                <h2 class="form-title">Register Student</h2>
                <p class="form-subtitle">Fill in the library access details</p>
            </div>

            <div class="alert-info-custom">
                <i class="bi bi-info-circle-fill"></i>
                <p>System will auto-generate a PDF receipt and email the student instantly.</p>
            </div>

            <form th:action="@{/admin/save-student}" th:object="${student}" method="POST">
                
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" th:field="*{name}" placeholder="Student's name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mobile Number</label>
                    <input type="tel" pattern="[0-9]{10}" class="form-control" th:field="*{mobileNumber}" placeholder="10-digit number" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" th:field="*{email}" placeholder="example@mail.com" required>
                </div>

                <div class="row g-2">
                    <div class="col-6 mb-3">
                        <label class="form-label">Duration</label>
                        <select class="form-select" th:field="*{feesPeriodMonths}" required>
                            <option value="1">1 Month</option>
                            <option value="2">2 Months</option>
                            <option value="3">3 Months</option>
                            <option value="6">6 Months</option>
                        </select>
                    </div>

                    <div class="col-6 mb-3">
                        <label class="form-label">Fees (₹)</label>
                        <input type="number" class="form-control" th:field="*{feesPaid}" placeholder="0" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    REGISTER & SEND INVOICE
                </button>

            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
