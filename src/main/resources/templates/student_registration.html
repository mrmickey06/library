<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Student Registration | Success Point Library Bhiwani</title>
    <meta name="description" content="Register as a student at Success Point Library Bhiwani. Submit your details for admin approval and start your focused study journey.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="/student-registration">
    <meta property="og:title" content="Student Registration | Success Point Library">
    <meta property="og:description" content="Submit student registration request to join Success Point Library Bhiwani.">
    <meta property="og:url" content="/student-registration">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #f1f5f9;
            --ink: #0f172a;
            --muted: #64748b;
            --line: #dbe7f3;
            --primary: #0f766e;
            --primary-dark: #115e59;
            --card: #ffffff;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #dbeafe 0%, #f1f5f9 42%, #ecfeff 100%);
            color: var(--ink);
            min-height: 100vh;
        }

        .page-wrap {
            max-width: 760px;
            margin: 28px auto;
            padding: 0 14px;
        }

        .form-shell {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.09);
        }

        .hero-strip {
            background: linear-gradient(135deg, #0f766e 0%, #0e7490 50%, #2563eb 100%);
            color: #f8fafc;
            padding: 1rem 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .hero-strip h5 {
            margin: 0;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.01em;
        }

        .hero-strip p {
            margin: 2px 0 0 0;
            font-size: 0.82rem;
            color: rgba(248, 250, 252, 0.9);
        }

        .btn-home {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #fff;
            border-radius: 999px;
            padding: 6px 12px;
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .form-body {
            padding: 1.2rem;
        }

        .form-label {
            font-size: 0.75rem;
            font-weight: 800;
            color: #334155;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-control {
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            padding: 11px 12px;
            font-weight: 600;
            background: #fcfdff;
        }

        .form-control:focus {
            border-color: #14b8a6;
            box-shadow: 0 0 0 0.2rem rgba(20, 184, 166, 0.15);
        }

        .btn-submit {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), #14b8a6);
            color: #fff;
            box-shadow: 0 12px 24px rgba(15, 118, 110, 0.2);
        }

        .info-strip {
            background: #ecfeff;
            border: 1px solid #a5f3fc;
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 0.82rem;
            color: #0f766e;
            font-weight: 600;
        }

        .discount-note {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 0.8rem;
            color: #475569;
            line-height: 1.5;
        }

        .helper-line {
            margin-top: 14px;
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .helper-line a {
            color: var(--primary-dark);
            font-weight: 700;
            text-decoration: none;
        }

        @media (max-width: 576px) {
            .page-wrap { margin: 12px auto; }
            .form-shell { border-radius: 14px; }
            .hero-strip { padding: 0.85rem 0.9rem; align-items: flex-start; }
            .hero-strip h5 { font-size: 0.94rem; }
            .hero-strip p { font-size: 0.76rem; }
            .form-body { padding: 0.95rem; }
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <div class="form-shell">
            <div class="hero-strip">
                <div>
                    <h5>Student Registration</h5>
                    <p>Fill details and send your request to admin.</p>
                </div>
                <a href="/" class="btn-home">Home</a>
            </div>

            <div class="form-body">

                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <div class="info-strip mb-3">
                    Approved students can login after admin approval.
                </div>

                <form th:action="@{/student-registration}" th:object="${student}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" th:field="*{name}" placeholder="Enter student name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mobile Number</label>
                        <input type="tel" pattern="[0-9]{10}" class="form-control" th:field="*{mobileNumber}" placeholder="10-digit mobile number" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" th:field="*{email}" placeholder="example@mail.com" required>
                    </div>

                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label">Month Plan</label>
                            <input type="number" min="1" max="24" class="form-control" th:field="*{feesPeriodMonths}" placeholder="Months" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Fees</label>
                            <input type="number" min="0" step="0.01" class="form-control" th:field="*{feesPaid}" placeholder="Amount" required>
                        </div>
                    </div>

                    <div class="discount-note mt-3 mb-3">
                        Discount guide: 1 month no discount, 2 months Rs 100, 3 months Rs 200, then Rs 100 extra for each additional month.
                    </div>

                    <button type="submit" class="btn-submit">Send Registration Request</button>
                </form>

                <div class="helper-line">
                    Already approved? <a href="/student-login">Student login</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
