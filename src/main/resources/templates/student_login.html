<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Student Portal | Success Point</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f0f9ff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .student-card { background: white; border-radius: 30px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(14, 165, 233, 0.1); border: 1px solid #e0f2fe; }
        .portal-icon { width: 60px; height: 60px; background: #0ea5e9; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.5rem; }
        .form-control { border-radius: 12px; padding: 12px; border: 2px solid #f1f5f9; font-weight: 600; }
        .btn-student { background: #0ea5e9; border: none; border-radius: 12px; padding: 14px; font-weight: 800; color: white; width: 100%; margin-top: 15px; }
        .hint-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; padding: 10px; font-size: 0.8rem; color: #166534; text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="student-card text-center">
        <div class="portal-icon"><i class="bi bi-mortarboard-fill"></i></div>
        <h3 class="fw-800">Student Portal</h3>
        <p class="text-muted small mb-4">Login to access your resources</p>
        
        <div th:if="${error}" class="alert alert-danger small py-2" th:text="${error}"></div>
        
        <div class="hint-box"><strong>Pass:</strong> Use default <b>SP@123</b></div>
        
        <form action="/student-login" method="POST">
            <input type="tel" class="form-control mb-3" name="mobileNumber" placeholder="Mobile Number" required>
            <input type="password" class="form-control mb-4" name="password" placeholder="Password" required>
            <button type="submit" class="btn btn-student">SIGN IN</button>
        </form>
        <a href="/" class="d-block mt-4 text-secondary text-decoration-none small fw-bold">← BACK TO HOME</a>
    </div>
</body>
</html>
